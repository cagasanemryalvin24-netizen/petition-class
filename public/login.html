<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Login - Petition System</title>
<link rel="stylesheet" href="style.css"></head>
<body class="auth">
<div class="logo">P</div>
<h1>Petition System</h1>
<p class="sub">Sign in to continue</p>
<form id="loginForm">
  <input id="email" type="email" placeholder="Email" required>
  <input id="password" type="password" placeholder="Password" required>
  <button type="submit">Log in</button>
  <p id="msg" class="msg"></p>
  <p>No account? <a href="register.html">Register</a></p>
</form>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const res = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email.value, password: password.value })
  });
  const data = await res.json();
  if (!res.ok) { msg.textContent = data.message; return; }
  localStorage.setItem("token", data.token);
  localStorage.setItem("role", data.user.role);
  localStorage.setItem("name", data.user.fullName);
  const pages = { student: "student.html", reviewer: "reviewer.html", admin: "admin.html" };
  location.href = pages[data.user.role];
});
</script></body></html>
